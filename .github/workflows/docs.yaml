name: Docs

# Only for documentation; code changes run `ci.yaml`
# (docs/contributor/documentation-rules.md).
on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]
  # To republish the site without a change: Actions → Docs → Run workflow.
  workflow_dispatch:
  # promote.yaml, once a release is the latest: the site's root follows it.
  workflow_call:
  pull_request:
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Offline: links between our own files and anchors. The web is not
      # checked here, so a site being down never fails a docs change.
      # Not the site's pages: their `@/page.md` links are Zola's, which lychee
      # reads as missing files, and `zola check` below checks them and their
      # anchors.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path "docs/(node_modules|\.tools|public|content)" "docs/**/*.md" "*.md"
          fail: true

  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Diagrams are drawn in a headless Chromium (docs/tools/diagrams.mjs).
      - name: Install Chromium
        working-directory: docs
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps --only-shell chromium

      # The generated reference pages match their sources (config.example.zon, cli.zig).
      - name: Generated pages are current
        run: node docs/tools/generate.mjs --check

      - name: Check the site
        run: make -C docs check

      # The quality bar: axe, no sideways scroll, tap targets, line length.
      # Main's pages are published under /next/, with their banner: test that.
      - name: Test the site
        env:
          DOCS_CHANNEL: next
        run: make -C docs test

      # ---- The site as published: the release at the root, main under /next/ ----
      #
      # The root shows the latest release (the one people install, which
      # promote.yaml makes latest), built from its own tag, where its pages
      # passed this same test. Before the first release, main.
      - name: The release the site's root shows
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        if: steps.release.outputs.tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release

      - name: Build the root
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          src=.
          if [ -n "${{ steps.release.outputs.tag }}" ]; then
            src=release
            (cd release/docs && npm ci --no-audit --no-fund && npx playwright-core install --only-shell chromium)
          fi
          make -C "$src/docs" build OUT="$RUNNER_TEMP/site"

      # After the root: building the root with --force would remove /next/.
      - name: Build /next/
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCS_CHANNEL: next
        run: make -C docs build OUT="$RUNNER_TEMP/site/next" BASE_URL=https://m00qek.github.io/inkhold/next

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

  # PUBLISHES ONLY FROM `main`: https://m00qek.github.io/inkhold/ (the latest
  # release) and /next/ (main).
  pages:
    needs: [links, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
