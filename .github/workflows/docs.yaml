name: Docs

# Only for documentation; code changes run `ci.yaml`
# (docs/contributor/documentation-rules.md).
on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]
  # To republish the site without a change: Actions → Docs → Run workflow.
  workflow_dispatch:
  pull_request:
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Offline: links between our own files and anchors. The web is not
      # checked here, so a site being down never fails a docs change.
      # Not the site's pages: their `@/page.md` links are Zola's, which lychee
      # reads as missing files, and `zola check` below checks them and their
      # anchors.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --exclude-path "docs/(node_modules|\.tools|public|content)" "docs/**/*.md" "*.md"
          fail: true

  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Diagrams are drawn in a headless Chromium (docs/tools/diagrams.mjs).
      - name: Install Chromium
        working-directory: docs
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps --only-shell chromium

      # The generated reference pages match their sources (config.example.zon, cli.zig).
      - name: Generated pages are current
        run: node docs/tools/generate.mjs --check

      - name: Check the site
        run: make -C docs check

      - name: Build the site
        run: make -C docs build

      # The quality bar: axe, no sideways scroll, tap targets, line length.
      - name: Test the site
        run: make -C docs test

      # The build above, with the site's real address (docs/config.toml); the
      # test built its own copy, from the same sources, under a local one.
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  # PUBLISHES ONLY FROM `main`, like the image in ci.yaml: https://m00qek.github.io/inkhold/ is what it holds.
  pages:
    needs: [links, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
