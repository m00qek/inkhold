name: Docs

# Only for documentation; code changes run `ci.yaml`
# (docs/contributor/documentation-rules.md).
on:
  push:
    branches: [ "main", "stable" ]
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]
  # To republish the site without a change: Actions → Docs → Run workflow.
  workflow_dispatch:
  # promote.yaml, once a release is the latest: the site's root follows it.
  workflow_call:
  pull_request:
    paths: [ "docs/**", "**/*.md", "webapp/src/styles/00-tokens.css", "webapp/public/fonts/**", "config.example.zon", "backend/config.zig", "backend/cli.zig", "backend/routes.zig", ".github/workflows/docs.yaml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Offline: links between our own files and anchors. The web is not
      # checked here, so a site being down never fails a docs change.
      # Not the site's pages: their `@/page.md` links are Zola's, which lychee
      # reads as missing files, and `zola check` below checks them and their
      # anchors.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path "docs/(node_modules|\.tools|public|content)" "docs/**/*.md" "*.md"
          fail: true

  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Diagrams are drawn in a headless Chromium (docs/tools/diagrams.mjs).
      - name: Install Chromium
        working-directory: docs
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps --only-shell chromium

      # The generated reference pages match their sources (config.example.zon, cli.zig).
      - name: Generated pages are current
        run: node docs/tools/generate.mjs --check

      - name: Check the site
        run: make -C docs check

      # The quality bar: axe, no sideways scroll, tap targets, line length.
      # Main's pages are published under /next/, with their banner: test that.
      - name: Test the site
        env:
          DOCS_CHANNEL: next
        run: make -C docs test

      # ---- The site as published: stable at the root, main under /next/ -------
      #
      # The root is `stable`: the latest release (promote.yaml resets stable to
      # it) plus any docs fixes backported since. Before the first release,
      # main. /next/ is always main. So a push to either rebuilds both.
      - name: Is there a stable branch
        id: stable
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        run: echo "ref=$(git ls-remote --heads origin stable | grep -q . && echo stable || echo main)" >> "$GITHUB_OUTPUT"

      - name: Checkout the root's source
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.stable.outputs.ref }}
          path: root

      - name: Checkout main, for /next/
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: next

      - name: Build the root
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        run: |
          (cd root/docs && npm ci --no-audit --no-fund && npx playwright-core install --only-shell chromium)
          make -C root/docs build OUT="$RUNNER_TEMP/site"

      # After the root: building the root with --force would remove /next/.
      - name: Build /next/
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        env:
          DOCS_CHANNEL: next
        run: |
          (cd next/docs && npm ci --no-audit --no-fund && npx playwright-core install --only-shell chromium)
          make -C next/docs build OUT="$RUNNER_TEMP/site/next" BASE_URL=https://m00qek.github.io/inkhold/next

      - name: Upload the site for GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # PUBLISHES ONLY FROM `main` and `stable`: https://m00qek.github.io/inkhold/
  # (stable: the latest release and its docs fixes) and /next/ (main).
  pages:
    needs: [links, site]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
