name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Before the suites: a formatting failure is cheap to find and cheap to
      # fix, and finding it after twenty minutes of tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Parsers
        run: make parser-test

      - name: Test Backend
        run: make test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Cache Zig build (the MuPDF wasm is 441 C translation units)
        uses: actions/cache@v4
        with:
          # `setup-zig` caches the GLOBAL cache (~/.cache/zig), which holds the
          # unpacked MuPDF tarball. The compiled objects land in the repo-local
          # `.zig-cache`, which it does not cover — so a cold runner rebuilds all
          # of MuPDF (~3 min on 4 cores) on every job that runs `build:wasm`.
          # Keyed on what actually changes the artifact; anything else restores.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Setup Web Tests
        run: make web-test-setup

      - name: Test Frontend
        run: make web-test

  release:
    # GATED ON THE SUITES. Without this the release job ran in PARALLEL with
    # them, so a red build still uploaded artifacts — and the README points
    # beta testers straight at those downloads. Shipping a binary from a build
    # that failed is worse than shipping nothing.
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86-linux-musl, aarch64-linux-musl, arm-linux-musleabihf]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Zig build (shared across the matrix — the wasm is target-independent)
        uses: actions/cache@v4
        with:
          # Every matrix target rebuilds the SAME `pdf-decode.wasm` (it is
          # wasm32, not the release target), so without this the MuPDF compile is
          # paid four times in parallel for one artifact.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz
