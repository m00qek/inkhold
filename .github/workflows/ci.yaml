name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Before the suites: a formatting failure is cheap to find and cheap to
      # fix, and finding it after twenty minutes of tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Parsers
        run: make parser-test

      - name: Test Backend
        run: make test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Cache Zig build (the MuPDF wasm is 441 C translation units)
        uses: actions/cache@v4
        with:
          # `setup-zig` caches the GLOBAL cache (~/.cache/zig), which holds the
          # unpacked MuPDF tarball. The compiled objects land in the repo-local
          # `.zig-cache`, which it does not cover — so a cold runner rebuilds all
          # of MuPDF (~3 min on 4 cores) on every job that runs `build:wasm`.
          # Keyed on what actually changes the artifact; anything else restores.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Setup Web Tests
        run: make web-test-setup

      # The only place `-DSQLITE_TEMP_STORE=3` is checked. Removing that flag
      # changes nothing observable (measured — see `sqlite_core_wasm_flags`),
      # so the module refuses to open an index without it and this step is what
      # makes the refusal visible. A guard nobody runs is not a guard.
      - name: Test the sqlite-core wasm ABI
        run: zig build wasm-sqlite-core-test

      - name: Test Frontend
        run: make web-test

  release:
    # GATED ON THE SUITES. Without this the release job ran in PARALLEL with
    # them, so a red build still uploaded artifacts — and the README points
    # beta testers straight at those downloads. Shipping a binary from a build
    # that failed is worse than shipping nothing.
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86-linux-musl, aarch64-linux-musl, arm-linux-musleabihf]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Zig build (shared across the matrix — the wasm is target-independent)
        uses: actions/cache@v4
        with:
          # Every matrix target rebuilds the SAME `pdf-decode.wasm` (it is
          # wasm32, not the release target), so without this the MuPDF compile is
          # paid four times in parallel for one artifact.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz

  # ---- Container images -------------------------------------------------------
  #
  # ONE RUNNER PER ARCHITECTURE, exactly like `release` above and for the same
  # reason: each target is its own MuPDF compile, and four of them in series is
  # four times the wall clock for no saving. Each runner pushes a single-platform
  # image BY DIGEST (no tag), and `image-manifest` below stitches the digests
  # into one manifest list — the standard way to build a multi-arch tag without
  # the runners having to coordinate.
  #
  # NO QEMU, and that is a property of the image rather than an oversight: the
  # Dockerfile is COPY-only, so nothing foreign is ever EXECUTED during the
  # build. Zig cross-compiles the binary on the x86 runner and buildx only has
  # to lay bytes down.
  image:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-linux-musl
          - platform: linux/386
            target: x86-linux-musl
          - platform: linux/arm64
            target: aarch64-linux-musl
          - platform: linux/arm/v7
            target: arm-linux-musleabihf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      # The Makefile owns the layout, so a local `make docker-image` and this
      # produce the same context. One arch here, not all four.
      - name: Build the context for ${{ matrix.platform }}
        run: make docker-context DOCKER_ARCHES=${{ matrix.platform }}=${{ matrix.target }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PUSHES ONLY FROM `main`. A pull request still builds the image, because a
      # broken Dockerfile should fail review rather than the next release; it
      # just has nowhere to publish, and a fork's token could not push anyway.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # A file per digest, named by the digest, so the merge job can just list
      # the directory. The matrix cannot share a variable any other way.
      - name: Export the digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The manifest list: one tag that resolves to whichever of the four images
  # matches the puller's architecture.
  image-manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # `latest` for the people following main, and the commit sha for anyone who
      # needs to pin or to say exactly what they are running in a bug report.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.name.outputs.image }}:latest \
            --tag ${{ steps.name.outputs.image }}:${{ github.sha }} \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ steps.name.outputs.image }}:latest
