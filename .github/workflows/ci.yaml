name: Test

# Docs-only changes run `docs.yaml`, not this (docs/contributor/documentation-rules.md).
on:
  push:
    # A push to `main` or `stable` is tested. When build.zig.zon names a
    # version not yet released, the same run also builds, smoke-tests and, if
    # every job is green, publishes it and tags the commit: main releases the
    # next beta, stable a fix of the current one
    # (docs/content/contributor/release.md).
    branches: [ "main", "stable" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    paths-ignore: [ "docs/**", "**/*.md" ]
  # To run without a change, e.g. to retry a release after a docs-only fix:
  # Actions → Test → Run workflow. "Rehearse" builds and smoke-tests
  # everything a release would, and publishes nothing.
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Rehearse a release: build and smoke-test it, publish nothing"
        type: boolean
        default: false

# Read-only by default; only `publish` asks for more.
permissions:
  contents: read

# A newer push cancels a pull request's run, never main's or stable's: such a
# run may be publishing a release, and stopping it halfway would leave half one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/stable' }}

jobs:
  # ---- Built once ----------------------------------------------------------
  #
  # The three wasm modules and the SPA (`build`), and the x86_64 musl server
  # (`build-server`): the jobs below download them instead of compiling. Each
  # Zig job keeps its `.zig-cache`: the key changes with every commit, so each
  # run saves its own; the prefix restores the last one, and Zig's cache is
  # content-addressed, so unchanged code is simply reused.
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      # "true" when this run releases: a version not yet tagged, pushed to
      # main or stable.
      release: ${{ steps.version.outputs.pending == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request' }}
      # "true" when the release jobs run: a release, or a rehearsal of one.
      build-release: ${{ (steps.version.outputs.pending == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && github.event_name != 'pull_request') || inputs.rehearse == true }}
    steps:
      # All history: on stable, the version is checked against the release
      # stable is based on (`git describe`).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # On every run, pull requests too: a version that could never be
      # released (not 1.0.0-beta.N, or not newer than the last) fails here.
      - name: The version, and whether it is released yet
        id: version
        env:
          # A pull request is held to the rules of the branch it targets.
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: make release-status >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-build-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      # The only place `-DSQLITE_TEMP_STORE=3` is checked. Removing that flag
      # changes nothing observable (measured — see `sqlite_core_wasm_flags`),
      # so the module refuses to open an index without it and this step is what
      # makes the refusal visible. A guard nobody runs is not a guard.
      - name: Test the sqlite-core wasm ABI
        run: zig build wasm-sqlite-core-test

      # `npm run build` builds the wasm into public/ first, then the SPA.
      - name: Build the wasm and the SPA
        run: make web-dist

      - name: Upload the wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: webapp/public/*.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Upload the SPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: error
          retention-days: 1

  # The server that ships, for smoke and footprint. Its own job, beside
  # `build`: Zig compiles the server as one unit, about 5 minutes in
  # ReleaseSafe however warm the cache, and the web suites need none of it.
  build-server:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-server-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-server-

      - name: Build the x86_64 server
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl

      - name: Upload the x86_64 server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-x86_64
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The suites, side by side ----------------------------------------------
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-backend-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-backend-

      # Before the suite: a formatting failure is cheap to find and cheap to
      # fix, and finding it after the tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Backend
        run: make test

  test-parsers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            parsers/note/.zig-cache
            parsers/spd/.zig-cache
          key: ${{ runner.os }}-zig-parsers-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-parsers-

      - name: Test Parsers
        run: make parser-test

  # The memory ceilings in scripts/footprint.py, on the binary that ships.
  footprint:
    needs: [build-server]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the x86_64 server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-x86_64
          path: out

      - name: Measure the server footprint
        run: |
          chmod +x out/inkhold
          make footprint SERVER=out/inkhold

  test-web-unit:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Download the wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: webapp/public

      - name: Lint styles and unit tests
        run: make web-lint web-test-unit

  # The browser suite in four slices on four runners, on the dev server with
  # the wasm already built (E2E_PREBUILT), so no slice compiles anything.
  test-web-e2e:
    needs: [build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Setup Web Tests
        run: make web-test-setup

      - name: Download the wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: webapp/public

      - name: Browser tests, slice ${{ matrix.shard }} of 4
        env:
          E2E_PREBUILT: "1"
        run: make web-test-e2e SHARD=${{ matrix.shard }}/4

      - name: Tests that passed only on retry
        if: always()
        run: node webapp/scripts/flaky-report.mjs webapp/test-results/report.json

  # The shipped pieces together, nothing mocked: the x86_64 server serving the
  # built SPA. First sign-in, an upload, a page painted by the wasm decoder.
  smoke:
    needs: [build, build-server]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Setup Web Tests
        run: make web-test-setup

      - name: Download the x86_64 server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-x86_64
          path: out

      - name: Download the SPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Smoke test the server and the SPA
        run: |
          chmod +x out/inkhold
          make smoke SERVER=out/inkhold

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-traces
          path: webapp/test-results
          retention-days: 7

  # ---- A release -------------------------------------------------------------
  #
  # Only when `build` says this run releases. Built and smoke-tested while the
  # suites run; nothing leaves CI until `publish`, which waits for every job.

  release:
    needs: [build]
    if: needs.build.outputs.build-release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            platform: linux/amd64
          - target: x86-linux-musl
            platform: linux/386
          - target: aarch64-linux-musl
            platform: linux/arm64
          - target: arm-linux-musleabihf
            platform: linux/arm/v6
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      # One cache per target: a shared one was saved by whichever target
      # finished first, so the other three compiled from cold every time.
      - name: Cache Zig build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-release-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-release-${{ matrix.target }}-

      # Built once by `build` above; no Node on this runner at all.
      - name: Download the SPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }} SKIP_WEB=1

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz

      # THE SAME COMPILE, RELINKED WITHOUT DEBUG INFO — cheap, because
      # `.zig-cache` is warm in this very job. The tarball keeps its symbols,
      # so a beta tester's panic trace is readable, and the image gets 9.9 MB
      # instead of 58.4 MB.
      #
      # Post-stripping the artifact instead would be cheaper still and does not
      # work: `zig objcopy` answers `error: unimplemented`, and GNU objcopy on
      # the runner only knows its own architecture.
      - name: Relink stripped, for the image
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true \
            -Dtarget=${{ matrix.target }} $(make -s print-zig-cpu TARGET=${{ matrix.target }})

      - name: Upload the stripped binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The container images ---------------------------------------------------
  #
  # ONE RUNNER, and no compiler on it. The four binaries and the SPA are already
  # built; this only lays them out and pushes. That also removes the digest dance
  # a per-architecture matrix needs — buildx writes the manifest list itself when
  # one invocation covers every platform.
  #
  # NO QEMU, which is a property of the image rather than an oversight: the
  # Dockerfile is COPY-only, so nothing foreign is ever EXECUTED during a build.
  # Each archive run on its own architecture: aarch64 on GitHub's ARM runner,
  # the Pi 1's ARMv6 emulated (proves it runs there, not how fast), the 32-bit
  # x86 one natively, since an x86_64 kernel runs it.
  smoke-archive:
    needs: [build, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            runner: ubuntu-24.04
          - target: x86-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
          - target: arm-linux-musleabihf
            runner: ubuntu-24.04
            emulator: qemu-arm-static -cpu arm1176
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qemu
        if: matrix.emulator
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inkhold-${{ matrix.target }}

      - name: Smoke test the archive
        run: scripts/smoke-archive.sh inkhold-${{ matrix.target }}.tar.gz ${{ needs.build.outputs.version }} ${{ matrix.emulator }}

  # The image for each platform a runner can run natively, built from the same
  # COPY-only context `publish` pushes, and run as people will.
  smoke-image:
    needs: [build, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-linux-musl
            runner: ubuntu-24.04
          - platform: linux/arm64
            target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the SPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: docker/context/webapp/dist

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.target }}
          path: docker/context/${{ matrix.platform }}

      - name: Build the image
        run: |
          chmod +x docker/context/${{ matrix.platform }}/inkhold
          docker build --platform ${{ matrix.platform }} --file docker/Dockerfile \
            --build-arg VERSION=${{ needs.build.outputs.version }} --tag inkhold:smoke docker

      - name: Smoke test the image
        run: scripts/smoke-image.sh inkhold:smoke ${{ needs.build.outputs.version }}

  # Every job green, or nothing happens. Then, in this order: the image as the
  # version (and `:next`, from main), a draft release with the archives, their checksums
  # and provenance, and last the release made public, which creates the tag on
  # this commit. A failure before that last step leaves no tag, so the next run
  # on main tries the release again.
  #
  # `:latest`, `:beta` and the docs' download links move only on promotion
  # (promote.yaml), after the release has been soaked on `:next`.
  publish:
    needs: [build, build-server, release, smoke-archive, smoke-image, test-backend, test-parsers, footprint, test-web-unit, test-web-e2e, smoke]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # Never two at once, and never cancelled halfway.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the SPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: docker/context/webapp/dist

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/binaries
          pattern: binary-*

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: inkhold-*
          merge-multiple: true

      # Into the `TARGETPLATFORM` layout the Dockerfile copies from, using the
      # Makefile's own platform=target mapping.
      - name: Lay out the image context
        run: |
          set -e
          for a in $(make -s print-docker-arches); do
            platform="${a%%=*}"; target="${a##*=}"
            mkdir -p "docker/context/$platform"
            cp "/tmp/binaries/binary-$target/inkhold" "docker/context/$platform/inkhold"
            chmod +x "docker/context/$platform/inkhold"
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum inkhold-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Provenance for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/inkhold-*.tar.gz

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registries reject an uppercase path, and `github.repository` keeps the
      # owner's case.
      - name: The image's name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # No QEMU: the Dockerfile is COPY-only, so nothing foreign is executed.
      # `:next` is main's candidate: a fix released from stable gets its version
      # tag only, so it never knocks main's candidate off `:next`.
      - name: Push the image as the version (and :next, from main)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v6
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.VERSION }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:next', steps.name.outputs.image) || '' }}

      - name: Provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # The notes: the version's section of CHANGELOG.md (`build` refused the
      # release already if it had none).
      - name: The release, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > "$notes"
          fi
          gh release create "v$VERSION" dist/inkhold-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Inkhold $VERSION" --notes-file "$notes"

      - name: Publish the release, which tags this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,url,isPrerelease
