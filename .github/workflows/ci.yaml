name: Test

# Docs-only changes run `docs.yaml`, not this (docs/contributor/documentation-rules.md).
on:
  push:
    # `main` is the only branch: every push to it is tested AND published (below).
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    paths-ignore: [ "docs/**", "**/*.md" ]
  # To rebuild and republish without a change: Actions → Test → Run workflow.
  workflow_dispatch:

# Read-only by default; only `image` asks for more, to push to GHCR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- The suites, side by side ----------------------------------------------
  #
  # Each its own runner: the slowest one, not their sum, is how long a run takes.
  # Every Zig job keeps its `.zig-cache` between runs. The key changes with
  # every commit, so each run saves its own; the prefix restores the last one,
  # and Zig's cache is content-addressed, so objects of unchanged code are
  # simply reused.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-backend-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-backend-

      # Before the suite: a formatting failure is cheap to find and cheap to
      # fix, and finding it after the tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Backend
        run: make test

  test-parsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: |
            parsers/note/.zig-cache
            parsers/spd/.zig-cache
          key: ${{ runner.os }}-zig-parsers-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-parsers-

      - name: Test Parsers
        run: make parser-test

  footprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-footprint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-footprint-

      # The memory ceilings in scripts/footprint.py: idle RSS, the cost of a
      # parked socket, and that threads follow requests rather than sockets.
      - name: Measure the server footprint
        run: make footprint

  test-web-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      # The three wasm modules are wasm32, the same in every job that builds
      # them (and the MuPDF one is 441 C translation units).
      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-wasm-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-wasm-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      # The only place `-DSQLITE_TEMP_STORE=3` is checked. Removing that flag
      # changes nothing observable (measured — see `sqlite_core_wasm_flags`),
      # so the module refuses to open an index without it and this step is what
      # makes the refusal visible. A guard nobody runs is not a guard.
      - name: Test the sqlite-core wasm ABI
        run: zig build wasm-sqlite-core-test

      - name: Lint styles and unit tests
        run: |
          npm --prefix webapp run build:wasm
          npm --prefix webapp run lint:styles
          npm --prefix webapp run test:unit

  # The browser suite, in four slices on four runners: one runner took 19 min.
  test-web-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      # Restore only: test-web-unit saves the same wasm build.
      - name: Restore Zig build
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-wasm-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-wasm-

      - name: Setup Web Tests
        run: make web-test-setup

      # Before the suite, not by the dev server: Playwright gives the server
      # 60 s to answer, and a cold wasm build (MuPDF) takes minutes.
      - name: Build the wasm modules
        run: npm --prefix webapp run build:wasm

      - name: Browser tests, slice ${{ matrix.shard }} of 4
        working-directory: webapp
        run: npx playwright test --shard=${{ matrix.shard }}/4

  # ---- What gets published, built while the suites run ------------------------
  #
  # Not gated on the suites: nothing here publishes. The archives are workflow
  # artifacts, and nightly.link (the docs' download links) serves only the
  # latest SUCCESSFUL run, so a red run's archives are never what anyone
  # downloads. The image, which does publish, waits for every suite (below).
  #
  # `webapp/dist` is the same bytes for every architecture: built once, here.
  webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      # `npm run build` runs `build:wasm` first: the same wasm as the tests.
      - name: Restore Zig build
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-wasm-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-wasm-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Build the SPA
        run: make web-dist

      - name: Upload the SPA
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [webapp]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            platform: linux/amd64
          - target: x86-linux-musl
            platform: linux/386
          - target: aarch64-linux-musl
            platform: linux/arm64
          - target: arm-linux-musleabihf
            platform: linux/arm/v6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # One cache per target: a shared one was saved by whichever target
      # finished first, so the other three compiled from cold every time.
      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-release-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-release-${{ matrix.target }}-

      # Built once by `webapp` above; no Node on this runner at all.
      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }} SKIP_WEB=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz

      # THE SAME COMPILE, RELINKED WITHOUT DEBUG INFO — cheap, because
      # `.zig-cache` is warm in this very job. The tarball keeps its symbols,
      # so a beta tester's panic trace is readable, and the image gets 9.9 MB
      # instead of 58.4 MB.
      #
      # Post-stripping the artifact instead would be cheaper still and does not
      # work: `zig objcopy` answers `error: unimplemented`, and GNU objcopy on
      # the runner only knows its own architecture.
      - name: Relink stripped, for the image
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true \
            -Dtarget=${{ matrix.target }} $(make -s print-zig-cpu TARGET=${{ matrix.target }})

      - name: Upload the stripped binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The container images ---------------------------------------------------
  #
  # ONE RUNNER, and no compiler on it. The four binaries and the SPA are already
  # built; this only lays them out and pushes. That also removes the digest dance
  # a per-architecture matrix needs — buildx writes the manifest list itself when
  # one invocation covers every platform.
  #
  # NO QEMU, which is a property of the image rather than an oversight: the
  # Dockerfile is COPY-only, so nothing foreign is ever EXECUTED during a build.
  image:
    # GATED ON EVERY SUITE: this is the one job that publishes. A build that
    # failed a test, or blew the memory ceilings a Pi depends on, is not one
    # to ship as `:latest`.
    needs: [release, test-backend, test-parsers, footprint, test-web-unit, test-web-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: docker/context/webapp/dist

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/binaries
          pattern: binary-*

      # Into the `TARGETPLATFORM` layout the Dockerfile copies from, using the
      # Makefile's own platform=target mapping rather than a second copy of it —
      # an artifact name cannot carry a slash, so the two have to be related
      # somewhere, and the Makefile is where that relation already lives.
      - name: Lay out the build context
        run: |
          set -e
          for a in $(make -s print-docker-arches); do
            platform="${a%%=*}"; target="${a##*=}"
            mkdir -p "docker/context/$platform"
            cp "/tmp/binaries/binary-$target/inkhold" "docker/context/$platform/inkhold"
            chmod +x "docker/context/$platform/inkhold"
          done
          find docker/context -type f -printf '%p  %s bytes\n'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Before the build step, which needs it. Registries reject an uppercase
      # path and `github.repository` preserves whatever case the owner typed.
      - name: Lowercase the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # PUSHES ONLY FROM `main`: `:latest` is what it holds. A pull request still builds every architecture,
      # so a broken Dockerfile fails review rather than the next release; it
      # simply has nowhere to publish, and a fork's token could not push anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v6
          build-args: |
            VERSION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

      - name: Show what was published
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect ${{ steps.name.outputs.image }}:latest
