name: Test

# Docs-only changes run `docs.yaml`, not this (docs/contributor/documentation-rules.md).
on:
  push:
    # A push to `main` is tested. A version tag (`v0.1.0`) is tested AND
    # published: the image, and a GitHub release with the archives (below).
    # Path filters do not apply to tags.
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore: [ "docs/**", "**/*.md" ]
  pull_request:
    paths-ignore: [ "docs/**", "**/*.md" ]
  # To run the suites without a change: Actions → Test → Run workflow.
  workflow_dispatch:

# Read-only by default; `image` asks for more to push to GHCR, and
# `github-release` to create the release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Built once ----------------------------------------------------------
  #
  # The three wasm modules, the SPA and the x86_64 musl server: every job below
  # downloads them instead of compiling its own. This is the only web job with
  # Zig, so its `.zig-cache` is the one that stays warm. The key changes with
  # every commit, so each run saves its own; the prefix restores the last one,
  # and Zig's cache is content-addressed, so unchanged code is simply reused.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A tag names the version the server reports (`inkhold --version`, from
      # build.zig.zon): a release whose binary says otherwise is refused.
      - name: The tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but build.zig.zon says $want"
            exit 1
          fi

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-build-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      # The only place `-DSQLITE_TEMP_STORE=3` is checked. Removing that flag
      # changes nothing observable (measured — see `sqlite_core_wasm_flags`),
      # so the module refuses to open an index without it and this step is what
      # makes the refusal visible. A guard nobody runs is not a guard.
      - name: Test the sqlite-core wasm ABI
        run: zig build wasm-sqlite-core-test

      # `npm run build` builds the wasm into public/ first, then the SPA.
      - name: Build the wasm and the SPA
        run: make web-dist

      - name: Build the x86_64 server
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl

      - name: Upload the wasm
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: webapp/public/*.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Upload the SPA
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload the x86_64 server
        uses: actions/upload-artifact@v4
        with:
          name: server-x86_64
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The suites, side by side ----------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-backend-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-backend-

      # Before the suite: a formatting failure is cheap to find and cheap to
      # fix, and finding it after the tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Backend
        run: make test

  test-parsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: |
            parsers/note/.zig-cache
            parsers/spd/.zig-cache
          key: ${{ runner.os }}-zig-parsers-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-parsers-

      - name: Test Parsers
        run: make parser-test

  # The memory ceilings in scripts/footprint.py, on the binary that ships.
  footprint:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the x86_64 server
        uses: actions/download-artifact@v4
        with:
          name: server-x86_64
          path: out

      - name: Measure the server footprint
        run: |
          chmod +x out/inkhold
          make footprint SERVER=out/inkhold

  test-web-unit:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Download the wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: webapp/public

      - name: Lint styles and unit tests
        run: make web-lint web-test-unit

  # The browser suite in four slices on four runners, on the dev server with
  # the wasm already built (E2E_PREBUILT), so no slice compiles anything.
  test-web-e2e:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Setup Web Tests
        run: make web-test-setup

      - name: Download the wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: webapp/public

      - name: Browser tests, slice ${{ matrix.shard }} of 4
        env:
          E2E_PREBUILT: "1"
        run: make web-test-e2e SHARD=${{ matrix.shard }}/4

  # The shipped pieces together, nothing mocked: the x86_64 server serving the
  # built SPA. First sign-in, an upload, a page painted by the wasm decoder.
  smoke:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Setup Web Tests
        run: make web-test-setup

      - name: Download the x86_64 server
        uses: actions/download-artifact@v4
        with:
          name: server-x86_64
          path: out

      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Smoke test the server and the SPA
        run: |
          chmod +x out/inkhold
          make smoke SERVER=out/inkhold

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: webapp/test-results
          retention-days: 7

  # ---- A release: built while the suites run, published once they pass ---------
  #
  # Only for a version tag. Nothing is published until `image` and
  # `github-release`, which wait for every suite.
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            platform: linux/amd64
          - target: x86-linux-musl
            platform: linux/386
          - target: aarch64-linux-musl
            platform: linux/arm64
          - target: arm-linux-musleabihf
            platform: linux/arm/v6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # One cache per target: a shared one was saved by whichever target
      # finished first, so the other three compiled from cold every time.
      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zig-release-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-zig-release-${{ matrix.target }}-

      # Built once by `build` above; no Node on this runner at all.
      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }} SKIP_WEB=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz

      # THE SAME COMPILE, RELINKED WITHOUT DEBUG INFO — cheap, because
      # `.zig-cache` is warm in this very job. The tarball keeps its symbols,
      # so a beta tester's panic trace is readable, and the image gets 9.9 MB
      # instead of 58.4 MB.
      #
      # Post-stripping the artifact instead would be cheaper still and does not
      # work: `zig objcopy` answers `error: unimplemented`, and GNU objcopy on
      # the runner only knows its own architecture.
      - name: Relink stripped, for the image
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true \
            -Dtarget=${{ matrix.target }} $(make -s print-zig-cpu TARGET=${{ matrix.target }})

      - name: Upload the stripped binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The container images ---------------------------------------------------
  #
  # ONE RUNNER, and no compiler on it. The four binaries and the SPA are already
  # built; this only lays them out and pushes. That also removes the digest dance
  # a per-architecture matrix needs — buildx writes the manifest list itself when
  # one invocation covers every platform.
  #
  # NO QEMU, which is a property of the image rather than an oversight: the
  # Dockerfile is COPY-only, so nothing foreign is ever EXECUTED during a build.
  image:
    # GATED ON EVERY SUITE: a build that failed a test, or blew the memory
    # ceilings a Pi depends on, is not one to ship as `:latest`.
    needs: [release, test-backend, test-parsers, footprint, test-web-unit, test-web-e2e, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: docker/context/webapp/dist

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/binaries
          pattern: binary-*

      # Into the `TARGETPLATFORM` layout the Dockerfile copies from, using the
      # Makefile's own platform=target mapping rather than a second copy of it —
      # an artifact name cannot carry a slash, so the two have to be related
      # somewhere, and the Makefile is where that relation already lives.
      - name: Lay out the build context
        run: |
          set -e
          for a in $(make -s print-docker-arches); do
            platform="${a%%=*}"; target="${a##*=}"
            mkdir -p "docker/context/$platform"
            cp "/tmp/binaries/binary-$target/inkhold" "docker/context/$platform/inkhold"
            chmod +x "docker/context/$platform/inkhold"
          done
          find docker/context -type f -printf '%p  %s bytes\n'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Before the build step, which needs it. Registries reject an uppercase
      # path and `github.repository` preserves whatever case the owner typed.
      - name: Lowercase the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # `:latest` is the newest release; the version tag stays on its build.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v6
          build-args: |
            VERSION=${{ github.ref_name }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ steps.name.outputs.image }}:latest

  # The release page: the four archives (the docs' download links point at the
  # latest release's) and notes generated from the commits since the last tag.
  github-release:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          pattern: inkhold-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" inkhold-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
