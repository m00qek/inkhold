name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Before the suites: a formatting failure is cheap to find and cheap to
      # fix, and finding it after twenty minutes of tests is neither.
      - name: Check formatting
        run: make fmt

      - name: Test Parsers
        run: make parser-test

      - name: Test Backend
        run: make test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('webapp/package-lock.json') }}

      - name: Cache Zig build (the MuPDF wasm is 441 C translation units)
        uses: actions/cache@v4
        with:
          # `setup-zig` caches the GLOBAL cache (~/.cache/zig), which holds the
          # unpacked MuPDF tarball. The compiled objects land in the repo-local
          # `.zig-cache`, which it does not cover — so a cold runner rebuilds all
          # of MuPDF (~3 min on 4 cores) on every job that runs `build:wasm`.
          # Keyed on what actually changes the artifact; anything else restores.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Setup Web Tests
        run: make web-test-setup

      # The only place `-DSQLITE_TEMP_STORE=3` is checked. Removing that flag
      # changes nothing observable (measured — see `sqlite_core_wasm_flags`),
      # so the module refuses to open an index without it and this step is what
      # makes the refusal visible. A guard nobody runs is not a guard.
      - name: Test the sqlite-core wasm ABI
        run: zig build wasm-sqlite-core-test

      - name: Test Frontend
        run: make web-test

  # ---- The SPA, built ONCE -----------------------------------------------------
  #
  # `webapp/dist` is the same bytes for every architecture, and it used to be
  # rebuilt by all four release runners and all four image runners: eight
  # identical `npm run build`s per push. It is one job now, and everything
  # downstream downloads its output.
  webapp:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      # `npm run build` runs `build:wasm` first, so this needs the same Zig
      # cache the binaries do — the three wasm modules are wasm32 and identical
      # across every release target.
      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      - name: Install Frontend Dependencies
        run: npm --prefix webapp ci

      - name: Build the SPA
        run: make web-dist

      - name: Upload the SPA
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: error
          retention-days: 1

  release:
    # GATED ON THE SUITES. Without this the release job ran in PARALLEL with
    # them, so a red build still uploaded artifacts — and the README points
    # beta testers straight at those downloads. Shipping a binary from a build
    # that failed is worse than shipping nothing.
    needs: [webapp]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            platform: linux/amd64
          - target: x86-linux-musl
            platform: linux/386
          - target: aarch64-linux-musl
            platform: linux/arm64
          - target: arm-linux-musleabihf
            platform: linux/arm/v6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig build (shared across the matrix — the wasm is target-independent)
        uses: actions/cache@v4
        with:
          # Every matrix target rebuilds the SAME `pdf-decode.wasm` (it is
          # wasm32, not the release target), so without this the MuPDF compile is
          # paid four times in parallel for one artifact.
          path: .zig-cache
          key: ${{ runner.os }}-zigcache-${{ hashFiles('build.zig', 'build.zig.zon', 'webapp/wasm/**') }}
          restore-keys: ${{ runner.os }}-zigcache-

      # Built once by `webapp` above; no Node on this runner at all.
      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist

      - name: Build Artifact
        run: make release-artifact TARGET=${{ matrix.target }} SKIP_WEB=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhold-${{ matrix.target }}
          path: inkhold-${{ matrix.target }}.tar.gz

      # THE SAME COMPILE, RELINKED WITHOUT DEBUG INFO — 42 s against the 65 s the
      # unstripped build above just paid, because `.zig-cache` is warm in this
      # very job. That is what makes it worth having both: the tarball keeps its
      # symbols, so a beta tester's panic trace is readable, and the image gets
      # 9.9 MB instead of 58.4 MB.
      #
      # Post-stripping the artifact instead would be cheaper still and does not
      # work: `zig objcopy` answers `error: unimplemented`, and GNU objcopy on
      # the runner only knows its own architecture.
      - name: Relink stripped, for the image
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true \
            -Dtarget=${{ matrix.target }} $(make -s print-zig-cpu TARGET=${{ matrix.target }})

      - name: Upload the stripped binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: zig-out/bin/inkhold
          if-no-files-found: error
          retention-days: 1

  # ---- The container images ---------------------------------------------------
  #
  # ONE RUNNER, and no compiler on it. The four binaries and the SPA are already
  # built; this only lays them out and pushes. That also removes the digest dance
  # a per-architecture matrix needs — buildx writes the manifest list itself when
  # one invocation covers every platform.
  #
  # NO QEMU, which is a property of the image rather than an oversight: the
  # Dockerfile is COPY-only, so nothing foreign is ever EXECUTED during a build.
  image:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the SPA
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: docker/context/webapp/dist

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/binaries
          pattern: binary-*

      # Into the `TARGETPLATFORM` layout the Dockerfile copies from, using the
      # Makefile's own platform=target mapping rather than a second copy of it —
      # an artifact name cannot carry a slash, so the two have to be related
      # somewhere, and the Makefile is where that relation already lives.
      - name: Lay out the build context
        run: |
          set -e
          for a in $(make -s print-docker-arches); do
            platform="${a%%=*}"; target="${a##*=}"
            mkdir -p "docker/context/$platform"
            cp "/tmp/binaries/binary-$target/inkhold" "docker/context/$platform/inkhold"
            chmod +x "docker/context/$platform/inkhold"
          done
          find docker/context -type f -printf '%p  %s bytes\n'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Before the build step, which needs it. Registries reject an uppercase
      # path and `github.repository` preserves whatever case the owner typed.
      - name: Lowercase the image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # PUSHES ONLY FROM `main`. A pull request still builds every architecture,
      # so a broken Dockerfile fails review rather than the next release; it
      # simply has nowhere to publish, and a fork's token could not push anyway.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v6
          build-args: |
            VERSION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

      - name: Show what was published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect ${{ steps.name.outputs.image }}:latest
