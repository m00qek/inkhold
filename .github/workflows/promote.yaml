name: Promote

# After a release has been soaked on `:next`: make it the one people get.
# No rebuild: `:latest` and `:beta` point at the same image digest, and the
# release becomes GitHub's latest, which the docs' download links follow,
# `stable` is reset to it, and the docs site's root is rebuilt from stable.
# `make promote VERSION=1.0.0-beta.N` starts it
# (docs/content/contributor/release.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to promote, e.g. 1.0.0-beta.2"
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only a published release that passed its smoke tests (publish runs
      # last), and never one older than what people already have.
      - name: The release can be promoted
        run: |
          set -e
          echo "$VERSION" | grep -Eqx '1\.0\.0-beta\.[1-9][0-9]*(\.[1-9][0-9]*)?' \
            || { echo "::error::not a release version: $VERSION"; exit 1; }
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false \
            || { echo "::error::v$VERSION is not a published release"; exit 1; }
          # 1.0.0-beta.N.M as one number, M = 0 for a beta itself: beta.2 < beta.2.1 < beta.3.
          order() { v=${1#v}; v=${v#1.0.0-beta.}; n=${v%%.*}; m=0; [ "$v" = "$n" ] || m=${v#*.}; echo $((n * 1000 + m)); }
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -n "$current" ] && [ "$(order "$VERSION")" -lt "$(order "$current")" ]; then
            echo "::error::v$VERSION is older than $current, the current latest"
            exit 1
          fi
          echo "promoting v$VERSION (latest was ${current:-none})"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Point :latest and :beta at the release's image
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create --tag "$image:latest" --tag "$image:beta" "$image:$VERSION"
          docker buildx imagetools inspect "$image:latest"

      - name: Make it the latest release
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      # `stable` is what people have: reset to this release, dropping the
      # backports the previous one carried (this release has them, or newer).
      - name: Reset stable to the release
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$sha" -F force=true --jq .object.sha
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$sha" --jq .object.sha
          fi

  # The site's root now shows this release (stable).
  docs:
    needs: [promote]
    uses: ./.github/workflows/docs.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
